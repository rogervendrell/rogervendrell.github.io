title: "Semantic and Personalized Search for KTH's Scientific Literature"
year: 2025
short_description: >
  A semantic and author-personalized search engine for KTH's computer science literature,
  built with Elasticsearch, sentence transformers, a coauthorship graph, and a
  learning-to-rank reranker.

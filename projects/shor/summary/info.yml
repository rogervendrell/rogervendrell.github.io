title: "A from-scratch Qiskit implementation of Shor's Factoring Algorithm"
year: 2024
short_description: >
  A from-scratch Qiskit implementation of Shor's factoring algorithm, built around a
  2n+3 qubit order-finding circuit.
thumbnail: thumbnail.png
thumbnail_alt: >
  Diagram: a number goes into a quantum order-finding circuit, which reveals a hidden
  period, which is used to compute the number's two prime factors.
tags: [Shor's Algorithm, Quantum Computing, Qiskit, Quantum Fourier Transform, Integer Factorization, RSA]

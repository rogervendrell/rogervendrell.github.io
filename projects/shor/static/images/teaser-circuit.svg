<svg viewBox="0 0 870 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>How the algorithm works, at a glance</title>
  <desc>A composite number goes into a quantum order-finding circuit, which reveals a hidden
    period; that period is used to compute the number's two prime factors.</desc>

  <rect x="0" y="0" width="870" height="260" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#209cee"/>
    </marker>
  </defs>

  <!-- arrows -->
  <g stroke="#209cee" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="165" y1="120" x2="222" y2="120"/>
    <line x1="395" y1="120" x2="432" y2="120"/>
    <line x1="605" y1="120" x2="653" y2="120"/>
  </g>

  <!-- 1. the number -->
  <circle cx="110" cy="120" r="50" fill="#ffffff" stroke="#209cee" stroke-width="3"/>
  <text x="110" y="134" text-anchor="middle" font-size="42" font-weight="700" fill="#12507e">N</text>
  <text x="110" y="225" text-anchor="middle" font-size="15" fill="#4a4a4a">A number to factor</text>

  <!-- 2. quantum circuit -->
  <rect x="230" y="70" width="160" height="100" rx="14" fill="#ffffff" stroke="#209cee" stroke-width="3"/>
  <g stroke="#c7d6e2" stroke-width="2">
    <line x1="250" y1="90"  x2="370" y2="90"/>
    <line x1="250" y1="110" x2="370" y2="110"/>
    <line x1="250" y1="130" x2="370" y2="130"/>
    <line x1="250" y1="150" x2="370" y2="150"/>
  </g>
  <g fill="#209cee" opacity="0.85">
    <rect x="267" y="75" width="6" height="90" rx="3"/>
    <rect x="307" y="75" width="6" height="90" rx="3"/>
    <rect x="347" y="75" width="6" height="90" rx="3"/>
  </g>
  <text x="310" y="225" text-anchor="middle" font-size="15" fill="#4a4a4a">Quantum order-finding circuit</text>

  <!-- 3. hidden period -->
  <rect x="440" y="70" width="160" height="100" rx="14" fill="#ffffff" stroke="#209cee" stroke-width="3"/>
  <g fill="#209cee">
    <rect x="460" y="85"  width="18" height="70" rx="3" opacity="1"/>
    <rect x="485" y="135" width="18" height="20" rx="3" opacity="0.35"/>
    <rect x="510" y="85"  width="18" height="70" rx="3" opacity="1"/>
    <rect x="535" y="135" width="18" height="20" rx="3" opacity="0.35"/>
    <rect x="560" y="85"  width="18" height="70" rx="3" opacity="1"/>
  </g>
  <text x="520" y="225" text-anchor="middle" font-size="15" fill="#4a4a4a">Reveals a hidden period</text>

  <!-- 4. prime factors -->
  <circle cx="700" cy="120" r="42" fill="#ffffff" stroke="#209cee" stroke-width="3"/>
  <circle cx="800" cy="120" r="42" fill="#ffffff" stroke="#209cee" stroke-width="3"/>
  <text x="700" y="132" text-anchor="middle" font-size="30" font-weight="700" fill="#12507e">p</text>
  <text x="800" y="132" text-anchor="middle" font-size="30" font-weight="700" fill="#12507e">q</text>
  <text x="750" y="127" text-anchor="middle" font-size="18" fill="#9aa5b1">&#215;</text>
  <text x="750" y="225" text-anchor="middle" font-size="15" fill="#4a4a4a">Exposes its prime factors</text>
</svg>
